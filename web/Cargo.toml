[package]
name = "spatial-sound-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
hound = "3.5"
spatial_compare_lab_v2 = { path = "../spatial_compare_lab_v2" }
